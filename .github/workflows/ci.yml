name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: |
        cd frontend && pnpm install
        cd ../backend && pnpm install

    - name: Build frontend
      run: cd frontend && pnpm run build

    - name: Check backend source parses
      run: cd backend && find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  lint:
    runs-on: ubuntu-latest
    # Legacy lint debt from the 2024 code (65 frontend errors, no backend eslint);
    # reported but not blocking until it is cleaned up.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: |
        cd frontend && pnpm install
        cd ../backend && pnpm install

    - name: Lint frontend
      run: cd frontend && pnpm run lint

    - name: Lint backend
      run: cd backend && pnpm run lint

  # Fails the build when a high/critical dependency advisory (V9) or a
  # committed secret (V8) is introduced.
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # gitleaks needs the commit history, not just the last commit

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Audit backend dependencies
      run: cd backend && npm audit --audit-level=high

    - name: Scan for secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
